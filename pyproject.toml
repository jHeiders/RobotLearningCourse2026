[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mtsac"
version = "0.1.0"
description = "From single-task to multi-task reinforcement learning on the Meta-World benchmark (384.195 Robot Learning course project)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "metaworld>=3.1.1",
    "stable-baselines3>=2.9.0",
    "torch>=2.8",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tensorboard>=2.9.1",
    "wandb>=0.18",
    "tqdm>=4.66",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]
# Only needed to regenerate the report's figures from the TensorBoard logs.
plots = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["mtsac*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# reference/ is other people's code. Generate_code_V2/ is scratch work that is not wired
# into the project yet — drop it from this list once it is (or delete the folder).
extend-exclude = ["reference", "Generate_code_V2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
