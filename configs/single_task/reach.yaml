# R2: success > 90 %. The easiest task — treat it as the smoke test for the whole
# stack. If reach does not clear 90 %, something is wrong with the plumbing, not the
# hyperparameters.
extends: ../base.yaml
name: mt1-reach

env:
  tasks: [reach-v3]
  envs_per_task: 4           # no one-hot in single-task runs, so this is free throughput

algo:
  # 128 samples per task, matching MT3 (384/3) and MT10 (1280/10). The single-vs-multi
  # comparison is a graded deliverable, and leaving single-task on the default 512 would
  # give it 4x the per-task batch — multi-task would then look worse for a reason that
  # has nothing to do with inter-task interference.
  batch_size: 128

train:
  total_steps: 1000000
