# Single task: push. Target: success > 30 %.

algo: sac
id: st_push
tasks: [push-v3]

env:
  max_episode_steps: 250
  use_one_hot: false
  vector_strategy: async

sac:
  policy: MlpPolicy
  learning_rate: 4.0e-4
  buffer_size: 500000
  learning_starts: 5000
  batch_size: 512
  tau: 5.0e-3
  gamma: 0.99
  train_freq: 1
  gradient_steps: -1
  ent_coef: auto
  target_entropy: auto
  policy_kwargs:
    net_arch: [256, 256, 256]
    log_std_init: -3

train:
  total_steps: 2000000
  eval_freq: 100000
  n_eval_episodes: 10
  checkpoint_freq: 200000     # 0 disables; --resume continues from the latest
