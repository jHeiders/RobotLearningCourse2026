# Single task: pick-place. Target: success > 30 %.
# The hardest of the three single tasks — budget the tuning time here, not on reach.

algo: sac
id: st_pick_place
tasks: [pick-place-v3]

env:
  max_episode_steps: 1000
  use_one_hot: false
  vector_strategy: async

sac:
  policy: MlpPolicy
  learning_rate: 5.0e-4
  buffer_size: 800000
  learning_starts: 5000
  batch_size: 1024
  tau: 5.0e-3
  gamma: 0.95
  train_freq: 3               # 6 gradient steps per 3 environment steps -> UTD 2
  gradient_steps: 6
  ent_coef: auto
  target_entropy: auto
  policy_kwargs:
    net_arch: [1024, 1024, 512]
    log_std_init: -3

train:
  total_steps: 2000000
  eval_freq: 100000
  n_eval_episodes: 10
  checkpoint_freq: 200000     # 0 disables; --resume continues from the latest
