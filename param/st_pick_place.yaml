# Single task: pick-place. Target: success > 30 %.
# The hardest of the three single tasks — budget the tuning time here, not on reach.

algo: sac
id: st_pick_place
tasks: [pick-place-v3]

env:
  max_episode_steps: 1000
  use_one_hot: false
  vector_strategy: async
  envs_per_task: 16           # one environment leaves the critic diverging; see make_env

sac:
  policy: MlpPolicy
  learning_rate: 5.0e-4
  buffer_size: 800000
  learning_starts: 5000
  batch_size: 1024
  tau: 5.0e-3
  gamma: 0.95
  # `train_freq` counts env.step() calls, not transitions, so with 16 environments the
  # old `train_freq: 3` / `gradient_steps: 6` collects 48 transitions per 6 updates -- UTD
  # 0.125, not the 2 it was written for. These are the values push was validated with.
  train_freq: 1               # 16 gradient steps per 16 transitions collected -> UTD 1
  gradient_steps: -1
  ent_coef: auto
  target_entropy: auto
  policy_kwargs:
    net_arch: [1024, 1024, 512]
    log_std_init: -3

train:
  total_steps: 2000000
  eval_freq: 100000
  n_eval_episodes: 30          # 10 puts +-0.15 of noise on a 30 % target; eval is cheap
  checkpoint_freq: 200000     # 0 disables; --resume continues from the latest
