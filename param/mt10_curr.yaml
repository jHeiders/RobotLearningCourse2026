# Ablation arm B: replay curriculum, no normalised critic loss.
#
# param/mt10_curr_warmstart_probe.yaml already tested this, but warm-started from the baseline's 2.2M
# checkpoint, which makes it a probe rather than an arm: it shares the baseline's optimiser
# state and replay contents, and covers a different step range than the other arms. This
# file runs the same mechanism from scratch to the full budget so the four cells of the
# ablation are directly comparable.
#
# Identical to mt10_norm_curr.yaml except that the critic loss is left unnormalised. It runs
# through MTSAC with the flag off rather than through stock SAC, so that all four arms share
# one code path; tests/test_mtsac.py asserts that this is equivalent to plain SAC.

algo: mtsac
id: mt10_curr
tasks: mt10

env:
  max_episode_steps: 200
  use_one_hot: true
  vector_strategy: async
  envs_per_task: 9

sac:
  policy: LayerNormSACPolicy
  learning_rate: 3.0e-4
  buffer_size: 3300000
  learning_starts: 5000
  batch_size: 384
  tau: 1.0e-3
  gamma: 0.95
  train_freq: 1
  gradient_steps: 60
  ent_coef: auto
  target_entropy: auto
  replay_buffer_class: TaskWeightedReplayBuffer
  replay_buffer_kwargs:
    floor: 0.1
    cap: 0.6
  policy_kwargs:
    net_arch: [512, 1024, 1024, 512]
    log_std_init: -3

train:
  total_steps: 9000000        # the budget every arm is compared at, set by mt10_norm_curr
  eval_freq: 100000
  n_eval_episodes: 30
  checkpoint_freq: 200000
  # No early stopping. If the curriculum alone does not lift the two hard tasks this arm goes
  # flat -- eight tasks pinned at 1.00, two at 0.00, so no task sets a personal best -- and
  # that is precisely the outcome that has to be seen to hold for the full budget rather than
  # be cut short. The combined arm's peg-insert-side was still at 0.00 at 2.7M.
  patience: null
