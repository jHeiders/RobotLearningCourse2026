# MT3: reach, push, pick-place in one policy. Target: mean success > 40 %.
#
# These are exactly the first three tasks of MT10, so the one-hot block here is a prefix
# of the MT10 one — which is what makes the MT3 -> MT10 comparison clean.

algo: sac
id: mt3
tasks: mt3                    # named set from mtsac/environments.py

env:
  max_episode_steps: 200
  use_one_hot: true           # without this the policy cannot tell the tasks apart
  vector_strategy: async
  envs_per_task: 5            # 15 environments; one per task leaves the critic diverging

sac:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  buffer_size: 300000         # one buffer shared by all tasks
  learning_starts: 5000
  batch_size: 128
  tau: 1.0e-3
  gamma: 0.99
  train_freq: 1
  # `train_freq` counts env.step() calls, so with 15 environments this is one update per
  # 15 transitions (UTD 0.067). That is deliberate: it is the ratio the reference MT3 run
  # used, and it updates far less aggressively than the single-task configs, which is what
  # lets this one keep gamma 0.99 where push needed 0.95.
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto
  policy_kwargs:
    net_arch: [512, 1024, 1024, 512]
    log_std_init: -3

train:
  total_steps: 6000000        # 2 M per task
  eval_freq: 100000
  n_eval_episodes: 30          # 10 puts +-0.15 of noise on a 40 % target; eval is cheap
  checkpoint_freq: 200000     # 0 disables; --resume continues from the latest
  patience: 25                # stop after 25 evals with no new best. The longest such
                              # gap in the MT3 run that reached 0.944 mean was 19.
