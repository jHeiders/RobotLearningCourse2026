name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4

      - name: Install MuJoCo's GL dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libosmesa6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      # Includes the end-to-end smoke train, so main can never carry a pipeline that
      # fails only once someone launches a real run.
      - name: Test
        run: uv run pytest -q
